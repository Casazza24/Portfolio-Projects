services:
  postgres:
    image: postgres:16
    container_name: retail_platform_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: retail
      POSTGRES_PASSWORD: retail
      POSTGRES_DB: retail
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  # Kafka-API compatible broker. Single binary, no ZooKeeper/KRaft quorum to
  # babysit -- same client code as Kafka, a fraction of the local footprint.
  redpanda:
    image: redpandadata/redpanda:v24.2.7
    container_name: retail_platform_redpanda
    restart: unless-stopped
    command:
      - redpanda
      - start
      - --smp=1
      - --memory=1G
      - --overprovisioned
      - --node-id=0
      - --check=false
      # Two listeners: `internal` for other containers, `external` for the
      # producer/Spark running on the host. A single advertised address can't
      # serve both, because the broker hands its advertised host back to the
      # client on metadata lookup.
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://localhost:19092
      - --rpc-addr=0.0.0.0:33145
      - --advertise-rpc-addr=redpanda:33145
    ports:
      - "19092:19092"  # Kafka API (host clients use localhost:19092)
      - "9644:9644"    # Admin API / metrics
    volumes:
      - redpandadata:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Web UI for topic/message inspection -- makes for a much better screen
  # recording than tailing a consumer in a terminal.
  redpanda-console:
    image: redpandadata/console:v2.7.2
    container_name: retail_platform_redpanda_console
    restart: unless-stopped
    depends_on:
      redpanda:
        condition: service_healthy
    environment:
      KAFKA_BROKERS: redpanda:9092
    ports:
      - "8080:8080"

volumes:
  pgdata:
  redpandadata:
