version: 2

# Two stars sharing dim_date, and nothing else.
#
#   fct_orders          -> dim_customers, dim_products, dim_sellers,
#                          dim_date, dim_weather
#   fct_order_payments  -> dim_customers, dim_date
#   fct_events          -> dim_items, dim_date
#
# The Olist and RetailRocket datasets describe two different retailers. There
# is no customer, product or transaction that appears in both, so no conformed
# dimension links the stars beyond the calendar. Pretending otherwise -- for
# instance mapping RetailRocket categories onto Olist ones -- would fabricate a
# join and every number computed across it would be meaningless. The two stars
# answer different questions on the same dashboard: Olist answers "what sold",
# RetailRocket answers "how do people browse".

models:

  # ---------------------------------------------------------------- facts ---

  - name: fct_orders
    description: >
      **Grain: one row per order line -- (order_id, order_item_id).**

      Order lines with their product, seller, customer and delivery outcome.
      Additive measures: `item_price`, `freight_value`, `item_revenue`.
      Non-additive across the lines of one order (correct on any single row,
      wrong if summed): `order_status`, all timestamp columns, `review_score`.
      Payment amounts are deliberately absent -- they are order-grain and live
      in `fct_order_payments`.

      Orders with no lines do not appear; at this grain they have nothing to
      record.
    columns:
      - name: order_line_key
        description: Surrogate key, order_id + '-' + order_item_id.
        tests: [not_null, unique]
      - name: order_id
        tests: [not_null]
      - name: order_item_id
        description: Per-order line sequence number, not a global key.
        tests: [not_null]
      - name: customer_id
        tests:
          - not_null
          - relationships:
              arguments:
                  to: ref('dim_customers')
                  field: customer_id
      - name: product_id
        tests:
          - not_null
          - relationships:
              arguments:
                  to: ref('dim_products')
                  field: product_id
      - name: seller_id
        tests:
          - not_null
          - relationships:
              arguments:
                  to: ref('dim_sellers')
                  field: seller_id
      - name: order_date
        description: Date of purchase. The date key for all revenue reporting.
        tests:
          - not_null
          - relationships:
              arguments:
                  to: ref('dim_date')
                  field: date_day
      - name: weather_key
        description: >
          customer_state + '-' + order_date, into dim_weather.
        tests:
          - not_null
          # warn, not error, and the only exception in a project that otherwise
          # runs relationships strict. Weather coverage is a property of how
          # far the Open-Meteo pull was run, not of the model: extend the order
          # data by a month without re-running ingestion/fetch_weather.py and
          # this legitimately breaks. That is a freshness problem to be told
          # about, not a reason to fail the build and block every other mart
          # from refreshing.
          - relationships:
              arguments:
                  to: ref('dim_weather')
                  field: weather_key
              config:
                  severity: warn
      - name: customer_state
        tests: [not_null]
      - name: order_status
        tests:
          - not_null
          - accepted_values:
              arguments:
                  values:
                    - delivered
                    - shipped
                    - canceled
                    - unavailable
                    - invoiced
                    - processing
                    - created
                    - approved
      - name: item_price
        description: Line price in BRL, excluding freight.
        tests: [not_null]
      - name: freight_value
        description: Line freight cost in BRL.
        tests: [not_null]
      - name: item_revenue
        description: item_price + freight_value. The additive revenue measure.
        tests: [not_null]
      - name: review_score
        description: >
          1-5, from the latest review on the order. Null where no review was
          filed. Non-additive -- average it per order, not per line.
        tests:
          - accepted_values:
              arguments:
                  values: [1, 2, 3, 4, 5]
                  quote: false
      - name: days_to_deliver
        description: Purchase to customer delivery, in days. Null until delivered.
      - name: days_early_vs_estimate
        description: Positive when delivered ahead of the estimate. Null until delivered.
      - name: is_late_delivery
        description: Null until delivered, so undelivered orders stay out of the rate.
      - name: delivery_timeliness_band
        description: >
          Six ordered bands of `days_early_vs_estimate`, from '>10d early' to
          '>10d late'. Null until delivered. Defined in the model rather than
          in the BI tool because the band boundaries are the x-axis of the
          dashboard's headline chart -- see docs/dashboard_design.md Q2.
          Always sort by `delivery_timeliness_sort`, never alphabetically.
        tests:
          - accepted_values:
              arguments:
                  values:
                    - '>10d early'
                    - 4-10d early
                    - 0-3d early
                    - 1-3d late
                    - 4-10d late
                    - '>10d late'
      - name: delivery_timeliness_sort
        description: >
          1-6, matching `delivery_timeliness_band` in order. A sort key, not a
          measure. Null until delivered.
      - name: is_order_header_line
        description: >
          True on `order_item_id = 1`, so exactly one row per order. Filter on
          it to average header attributes (`review_score`, `days_to_deliver`)
          per order instead of per line. Not a substitute for
          count(distinct order_id).
        tests: [not_null]

  - name: fct_order_payments
    description: >
      **Grain: one row per payment instrument on an order --
      (order_id, payment_sequential).**

      Split payments produce multiple rows. `payment_value` is additive at this
      grain and only at this grain.
    columns:
      - name: order_payment_key
        tests: [not_null, unique]
      - name: order_id
        description: >
          Related to stg_olist__orders rather than to fct_orders: a small
          number of Olist orders have payments but no lines, so they exist as
          orders and correctly do not exist in the line-grain fact.
        tests:
          - not_null
          - relationships:
              arguments:
                  to: ref('stg_olist__orders')
                  field: order_id
      - name: customer_id
        tests:
          - not_null
          - relationships:
              arguments:
                  to: ref('dim_customers')
                  field: customer_id
      - name: order_date
        tests:
          - not_null
          - relationships:
              arguments:
                  to: ref('dim_date')
                  field: date_day
      - name: payment_type
        tests:
          - not_null
          - accepted_values:
              arguments:
                  values: [credit_card, boleto, voucher, debit_card, not_defined]
      - name: payment_installments
        tests: [not_null]
      - name: payment_value
        description: Amount in BRL on this instrument. Additive.
        tests: [not_null]

  - name: fct_events
    description: >
      **Grain: one row per clickstream event -- unique on event_id.**

      Factless: the measure is the row count. Funnel conversion is
      count(*) filtered by `event_type`; 2,742,263 rows for the full replay.

      `item_key` resolves to the -1 unknown member for events whose item never
      appeared in RetailRocket's metadata feed (9.27% of events, concentrated
      in views -- 2.1% of transactions). `item_id` keeps the real id regardless.
    columns:
      - name: event_id
        description: >
          Producer-assigned. Already deduped by the Spark layer; the unique
          test here catches a double-copy during the Snowflake load, which the
          Spark job has no way to see.
        tests: [not_null, unique]
      - name: item_key
        description: >
          Foreign key into dim_items. -1 where the item has no metadata, which
          is what lets this test run strict.
        tests:
          - not_null
          - relationships:
              arguments:
                  to: ref('dim_items')
                  field: item_id
      - name: item_id
        description: Real RetailRocket item id. Does not resolve for unknown items.
        tests: [not_null]
      - name: event_date
        tests:
          - not_null
          - relationships:
              arguments:
                  to: ref('dim_date')
                  field: date_day
      - name: event_type
        tests:
          - not_null
          - accepted_values:
              arguments:
                  values: [view, addtocart, transaction]
      - name: funnel_step
        description: >
          1 = view, 2 = addtocart, 3 = transaction. The funnel's step order,
          held in the model because `event_type` sorts alphabetically in every
          BI tool and would draw the funnel out of sequence. A sort key, never
          a measure.
        tests:
          - not_null
          - accepted_values:
              arguments:
                  values: [1, 2, 3]
                  quote: false
      - name: visitor_id
        tests: [not_null]
      - name: transaction_id
        description: >
          Populated only on `transaction` events. Degenerate -- RetailRocket
          ships no transaction table to join it to.
      - name: has_item_metadata
        description: >
          False for the 9.27% of events on unknown items. Lets an analyst
          exclude them deliberately, and is the numerator of the pipeline-health
          metric that assert_unknown_item_rate_within_bounds guards.
        tests: [not_null]

  # ----------------------------------------------------------- dimensions ---

  - name: dim_customers
    description: >
      **Grain: one row per customer_id** -- which in Olist means one row per
      order, not per person. Person-level columns (`orders_by_person`,
      `is_repeat_customer`, first/last order) are computed on
      customer_unique_id and repeated across that person's rows, so they are
      correct per row and must not be summed.
    columns:
      - name: customer_id
        tests: [not_null, unique]
      - name: customer_unique_id
        description: The actual person. Repeats. Group by this for cohort analysis.
        tests: [not_null]
      - name: customer_state
        tests: [not_null]
      - name: orders_by_person
        description: Orders placed by this customer_unique_id. Non-additive.
        tests: [not_null]
      - name: is_repeat_customer
        tests: [not_null]

  - name: dim_products
    description: >
      **Grain: one row per product_id** (Olist catalogue). No unknown member:
      the source enforces the foreign key, so orphans are impossible by
      construction and the relationships test on fct_orders is the guard.
      Missing categories fall back to 'unknown'; missing English translations
      fall back to the Portuguese name.
    columns:
      - name: product_id
        tests: [not_null, unique]
      - name: product_category
        description: >
          English category where a translation exists, Portuguese otherwise,
          'unknown' where the source has none. Never null -- Power BI drops
          null slices, which makes filtered totals silently disagree with the
          unfiltered total.
        tests: [not_null]
      - name: is_uncategorised
        tests: [not_null]
      - name: product_volume_cm3
        description: Null where any dimension is missing, rather than 0.

  - name: dim_sellers
    description: "**Grain: one row per seller_id.**"
    columns:
      - name: seller_id
        tests: [not_null, unique]
      - name: seller_state
        tests: [not_null]

  - name: dim_items
    description: >
      **Grain: one row per RetailRocket item_id, plus the synthetic
      item_id = -1 unknown member.**

      Current-state (latest known category per item), not point-in-time -- see
      docs/data_quality.md 3.5. The category hierarchy is carried as attributes
      rather than snowflaked into a dim_categories, because category has no
      attributes of its own beyond ids.

      `parent_category_id` / `root_category_id` are null for the 132 category
      ids that items reference but `category_tree.csv` never defines. Left null
      deliberately rather than merged into the -1 sentinel -- the model file
      explains why, and assert_orphan_categories_bounded pins the count.
    columns:
      - name: item_id
        tests: [not_null, unique]
      - name: category_id
        description: Null where the item has no category at all.
      - name: root_category_id
        description: >
          Top of the category tree. Null for orphan categories -- a
          descriptive attribute, not a foreign key, so nothing joins on it and
          no test is weakened by the null.
      - name: has_category_hierarchy
        tests: [not_null]
      - name: is_unknown_item
        description: True only for the -1 unknown member row.
        tests: [not_null]

  - name: dim_date
    description: >
      **Grain: one row per calendar day**, 2015-01-01 to 2019-12-31 (see the
      `date_spine_start` / `date_spine_end` vars). Generated in-warehouse from
      Snowflake's GENERATOR rather than loaded from a file -- a calendar has no
      upstream owner. The key is the DATE itself, not an integer surrogate.
    columns:
      - name: date_day
        tests: [not_null, unique]
      - name: day_of_week
        description: ISO -- 1 = Monday, 7 = Sunday.
        tests: [not_null]
      - name: is_weekend
        tests: [not_null]
      - name: year_month
        description: 'YYYY-MM. Sorts correctly as text, unlike ''Mar 2017''.'
        tests: [not_null]

  - name: dim_weather
    description: >
      **Grain: one row per (state, date)** -- 27 states x 774 days for the
      Olist window. One representative coordinate per state, taken from the
      median of that state's Olist geolocation rows, which is an approximation
      for large climatically mixed states and proportionate because ~90% of
      orders come from compact southeastern ones.
    columns:
      - name: weather_key
        description: state + '-' + weather_date. Readable on purpose, not hashed.
        tests: [not_null, unique]
      - name: state
        tests: [not_null]
      - name: weather_date
        tests: [not_null]
      - name: is_rainy_day
        description: rain_mm >= 1.0. Sub-millimetre readings are noise, not rain.
        tests: [not_null]
      - name: weather_condition
        description: WMO weather code banded into readable conditions.
        tests:
          - not_null
          - accepted_values:
              arguments:
                  values:
                    - clear_or_cloudy
                    - fog
                    - drizzle
                    - rain
                    - snow
                    - rain_showers
                    - thunderstorm
                    - other
