name: Build Grid Energy Dashboard

on:
  push:
    branches: [main]
    paths:
      - "grid-energy-demand-forecasting/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: grid-energy-demand-forecasting

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: grid-energy-demand-forecasting/requirements.txt

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install kaggle

      - name: Download data from Kaggle
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
        run: python pull_data.py

      - name: Generate mock spectral features
        run: python generate_mock_spectral.py

      - name: Run analysis pipeline
        run: python analysis.py

      - name: Build dashboard
        run: python build_dashboard.py

      - name: Commit and push dashboard
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add grid-energy-demand-forecasting/dashboard.html
          if git diff --cached --quiet; then
            echo "No changes to dashboard.html, skipping commit."
          else
            git commit -m "Auto-generate grid energy dashboard [skip ci]"
            git push
          fi
